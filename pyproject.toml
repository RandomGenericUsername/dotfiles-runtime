[project]
name = "dotfiles-runtime"
version = "0.1.0"
description = "Runtime engine for the dotfiles system — wallpaper, state, history, cache"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "cli-output",
    "fastjsonschema>=2.20",
    "jeepney>=0.9.0",
]

[project.scripts]
dotfiles-runtime = "runtime.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime"]

[tool.uv.sources]
cli-output = { path = "../shared/cli-output", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B905"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = "fastjsonschema"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jeepney.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.17",
    "mypy>=1.10",
]
