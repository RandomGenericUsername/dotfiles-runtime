# glass — the default/fallback skin. This manifest is the v1 parity target for
# today's ags-bar look: a translucent panel, a low-alpha card, a solid primary
# panel frame, no shadow and no backdrop blur. Values are extracted from
# ../ags-bar/style.css (:161-166, :181-186, :378-387, :422-429, :437-448).
# border-w is the outer panel/frame border (1.5px); hairline-w is the card,
# row-action and badge hairline (1px). The row/cell itself has no border.
schema_major = 1
name = "glass"

[shape]
radius-panel = 12
radius-card = 9
radius-cell = 7
radius-pill = 20
border-w = 1.5
hairline-w = 1

[rhythm]
gap = 8
cell-pad = "8px 9px"

[surface]
bg-panel = "alpha(@surface, 0.94)"
bg-card = "alpha(@surface_container_high, 0.18)"
border = "@primary"
shadow = "none"
blur = "none"

[ink]
ink = "@on_surface"
ink-dim = "alpha(@on_surface, 0.62)"
accent = "@primary"
ink-over = "auto"

[type]
font-family = "inherit"
title-size = 12.5
text-size = 13

[layout]
panel-width = 312
bt-list-spacing = 4
bar-row-height = 0
chip-min = 0
